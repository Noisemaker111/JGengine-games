name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [beta, main]
  # engine-bump.yml dispatches this on bot/engine-bump: pushes made with GITHUB_TOKEN start no runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check runs against engine source: the engine beta commit in engine-ref.txt, built
  # and linked over the install. The npm @jgengine/* packages are for outside users only.
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: The engine ref is a commit on engine beta
        run: bun run check:engine-ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the engine commit in engine-ref.txt
        run: |
          ref="$(bun scripts/engine-ref.ts show)"
          git init -q ../jgengine
          git -C ../jgengine remote add origin https://github.com/Noisemaker111/jgengine.git
          git -C ../jgengine fetch -q --depth 1 origin "$ref"
          git -C ../jgengine checkout -q --detach FETCH_HEAD
          git -C ../jgengine rev-parse HEAD
      - name: Build and link that engine
        run: bun run engine:sync --dir ../jgengine
      - run: bun run engine:status
      - run: bun run check:engine-mode
      - uses: actions/cache@v4
        with:
          path: |
            */public/models
            */public/materials
            */public/sprites
          key: game-assets-${{ hashFiles('bun.lock', '*/src/game/assets.ts') }}
          restore-keys: game-assets-
      # Rocketbox and Khronos library models list files through the GitHub contents API;
      # anonymous runners share a 60-an-hour limit and get HTTP 403, so the pull sends this token.
      - run: bun run provision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run check:framework --base origin/beta
      - run: bun run check:seam-line
      - run: bun run check:module-globals
      - run: bun run check:save-states
      - run: bun run check:game-design
      - run: bun run check:capabilities --summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run check-types
      - run: bun run test
      - run: bun run capabilities:probe

  # The bump branch lands by fast-forward once `games` passed on its exact commit, so beta's
  # tip is a commit CI proved. A non-fast-forward (beta moved) waits for the next bump run.
  promote-engine-bump:
    needs: games
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/bot/engine-bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin "HEAD:refs/heads/beta"
