name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [beta, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            */public/models
            */public/materials
            */public/sprites
          key: game-assets-${{ hashFiles('bun.lock', '*/src/game/assets.ts') }}
          restore-keys: game-assets-
      - run: bun run provision
      - run: bun run check:framework --base origin/beta
      - run: bun run check:seam-line
      - run: bun run check:module-globals
      - run: bun run check:capabilities --summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run check-types
      - run: bun run test
      - run: bun run capabilities:probe
